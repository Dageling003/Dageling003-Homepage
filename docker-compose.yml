services:
  # ============================================================
  # MariaDB — 可选。默认不启动。
  # 需要时：`docker compose --profile mariadb --env-file .env.docker up -d`
  # 并把 app 的 DB_TYPE 改成 mariadb。
  # 普通个人主页留空即可，app 会自动用 SQLite（单文件持久化到 app_data 卷）。
  # ============================================================
  mariadb:
    profiles: ["mariadb"]
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: homepage-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ${DB_DATABASE:-homepage}
      MARIADB_USER: ${DB_USERNAME:-}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-node:22-slim}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/nodejs22-debian12}
    image: homepage-app:latest
    container_name: homepage-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 数据库：默认 sqlite（单文件，无需容器）。生产也 OK。
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_SQLITE_PATH: ${DB_SQLITE_PATH:-/app/data/homepage.sqlite}
      # 以下 DB_* 仅在 DB_TYPE=mariadb 时生效
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-homepage}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CORS_ORIGIN: ${DOMAIN:-localhost}
      PORT: 8000
      NODE_OPTIONS: --max-old-space-size=256
      # === Feature toggles (默认全关，个人主页体验优先) ===
      AUDIT_ENABLED: ${AUDIT_ENABLED:-false}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-false}
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-false}
      SECURITY_HEADERS_STRICT: ${SECURITY_HEADERS_STRICT:-false}
      # 安全阈值（都是新手友好的默认，可以按需调高）
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-8}
      MIN_JWT_LENGTH: ${MIN_JWT_LENGTH:-16}
      # 找回密码 / 邮件（仅在 PASSWORD_RESET_ENABLED=true 时生效）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-}
    # Ports are NOT exposed to host — all traffic goes through Caddy (80/443)
    volumes:
      - app_uploads:/app/public/uploads
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "${HEALTHCHECK_NODE_PATH:-/nodejs/bin/node}", "-e", "const h=require('http');const req=h.get('http://localhost:8000/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    # Memory limit: `mem_limit` works with `docker compose up` (unlike deploy.resources which is Swarm-only).
    # Combined with NODE_OPTIONS=--max-old-space-size=256 to prevent OOM kills on small VPS.
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-node:22-slim}
    image: homepage-caddy:latest
    container_name: homepage-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_CA: ${ACME_CA:-https://acme.zerossl.com/v2/DV90}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  mariadb_data:
  app_uploads:
  app_data:
  caddy_data:
